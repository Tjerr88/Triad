<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Triad 3.3</title>
<style>
  :root{
    --bg:#0b0f14;
    --bg2:#111722;
    --card:rgba(17,23,34,.88);
    --card-strong:#161d29;
    --line:rgba(255,255,255,.10);
    --text:#eef3fb;
    --muted:#9ba9bd;
    --accent:#6f8fbd;
    --accent-soft:rgba(111,143,189,.14);
    --gold:#b59663;
    --danger:#b86969;
    --shadow:0 18px 40px rgba(0,0,0,.34);
    --radius:24px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--text);
    background: radial-gradient(circle at top left, rgba(181,150,99,.10), transparent 28%), radial-gradient(circle at top right, rgba(111,143,189,.10), transparent 30%), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .app{max-width:820px;margin:0 auto;display:grid;gap:16px;padding-bottom:48px}
  .card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .top{display:grid;gap:12px;background:linear-gradient(135deg, rgba(255,255,255,.03), rgba(255,255,255,.01));}
  h1{margin:0;font-size:2.6rem;line-height:.92;letter-spacing:-.05em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer}
  .sub{color:var(--muted);line-height:1.45;font-size:.98rem}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:.9rem;font-weight:700}
  .pill strong{color:var(--text)}
  .section-title{font-size:1.15rem;font-weight:900;margin:0 0 10px;letter-spacing:-.02em}
  .exercise{display:grid;gap:4px;padding:14px 15px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03)}
  .exercise .name{font-weight:850;font-size:1.04rem;letter-spacing:-.02em}
  .exercise .meta{font-size:.9rem;color:var(--muted)}
  .grid{display:grid;gap:10px}
  .grid-2{display:grid;gap:10px}
  @media(min-width:760px){.grid-2{grid-template-columns:1fr 1fr}}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tab-btn{appearance:none;border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;font-weight:850;cursor:pointer;background:rgba(255,255,255,.03);color:var(--muted)}
  .tab-btn.active{background:var(--accent-soft);color:var(--text);border-color:rgba(111,143,189,.35)}
  .btn{appearance:none;border:0;border-radius:18px;padding:16px 18px;font:inherit;font-weight:850;cursor:pointer;background:linear-gradient(180deg, #5d7b68, var(--accent));color:#fff;box-shadow:0 12px 24px rgba(77,102,86,.18)}
  .btn.secondary{background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--line);box-shadow:none}
  .btn.danger{background:linear-gradient(180deg,#b56f61,var(--danger));box-shadow:0 12px 24px rgba(159,93,80,.18)}
  .btn:active{transform:scale(.985)}
  .actions{display:grid;gap:10px}
  .timer-wrap{display:grid;gap:12px}
  .timer-big{font-size:3.5rem;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:1}
  .stage{font-size:1rem;font-weight:800}
  .small{font-size:.92rem;color:var(--muted);line-height:1.5}
  .timeline{display:grid;gap:8px}
  .timeline .item{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);color:var(--muted)}
  .timeline .item.active{background:var(--accent-soft);border-color:rgba(77,102,86,.22);color:var(--text)}
  .timeline .item.done{background:rgba(77,102,86,.08);border-color:rgba(77,102,86,.18);color:var(--text)}
  .done-wrap{display:grid;place-items:center;text-align:center;gap:10px;min-height:220px}
  .done-check{width:110px;height:110px;border-radius:999px;display:grid;place-items:center;background:rgba(77,102,86,.16);border:1px solid rgba(77,102,86,.28);font-size:3.5rem;font-weight:900;color:#dfeee2;box-shadow:0 18px 40px rgba(0,0,0,.22)}
  .done-title{font-size:1.45rem;font-weight:900;letter-spacing:-.03em}
  .settings-wrap{display:grid;gap:18px}
  .settings-group{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03)}
  .settings-group h3{margin:0;font-size:1rem;letter-spacing:-.02em}
  .choice-grid{display:grid;gap:10px}
  @media(min-width:760px){.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .choice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)}
  .choice input{margin-top:3px}
  .choice-title{font-weight:800;color:var(--text)}
  .choice-copy{font-size:.9rem;color:var(--muted);line-height:1.45}
  .setting-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)}
  .setting-row label{font-weight:800}
  .setting-row select{min-width:84px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-strong);color:var(--text);font:inherit}
  .confetti{position:fixed;top:-10px;width:10px;height:16px;border-radius:2px;pointer-events:none;z-index:9999;animation:fall linear forwards}
  @keyframes fall{to{transform:translate3d(var(--tx),105vh,0) rotate(var(--rot));opacity:1}}
</style>
</head>
<body>
<div class="app">
  <section class="card top">
    <h1 id="appTitle">Triad</h1>
    <div class="sub">Kettlebell - Clubbell - Mace - Active Recovery - Hypertrophy wave</div>
    <div class="row">
      <span class="pill">Position: <strong id="sessionCode">C1 - M1 - S1</strong></span>
      <span class="pill">Type: <strong id="sessionType">-</strong></span>
      <span class="pill">Focus: <strong id="sessionFocus">-</strong></span>
    </div>
  </section>

  <section class="card tabs">
    <button class="tab-btn active" id="sessionTabBtn" type="button">Session</button>
    <button class="tab-btn" id="settingsTabBtn" type="button">Settings</button>
  </section>

  <section class="card" id="sessionCard"></section>
  <section class="card" id="timerCard" style="display:none"></section>
  <section class="card" id="settingsCard" style="display:none"></section>

  <section class="card actions">
    <button class="btn secondary" id="newBtn">Next session</button>
    <button class="btn" id="finishBtn">Finish</button>
    <button class="btn danger" id="resetBtn">Reset</button>
    <div class="small">The session stays on screen until you press Finish. After that, Triad returns to a neutral screen. Start the next day when you are ready.</div>
  </section>
</div>

<script>
(() => {
  const STORAGE_KEY = 'triad-generator-v38';
  const RECOVERY_MODES = {
    gate: { key:'gate', label:'Gate recovery' },
    cycle4: { key:'cycle4', label:'4 day cycle' },
    cycle6: { key:'cycle6', label:'6 day cycle' },
    hypertrophy: { key:'hypertrophy', label:'Hypertrophy wave' }
  };
  const CLUB_MODE_OPTIONS = [
    { key:'single', label:'Single club', note:'One side at a time.' },
    { key:'double', label:'Double club', note:'Both clubs together for 60 second blocks.' },
    { key:'2h', label:'2H club', note:'Two-handed club variations and split grip blocks.' }
  ];
  const CLUBBELL_CATEGORY_LIMITS = {
    rhythmic: 3,
    ballistic: 3,
    grinds: 2
  };
  const CLUBBELL_CATEGORY_LABELS = {
    rhythmic: 'Rhythmic',
    ballistic: 'Ballistic',
    grinds: 'Grinds'
  };

  function getRotationForMode(mode){
    if(mode === 'cycle4') return ['Kettlebell','Clubbell','Mace','Active Recovery'];
    if(mode === 'cycle6') return ['Kettlebell','Active Recovery','Clubbell','Active Recovery','Mace','Active Recovery'];
    if(mode === 'hypertrophy') return ['Hypertrophy','Hypertrophy','Active Recovery','Hypertrophy','Hypertrophy','Active Recovery','Hypertrophy','Hypertrophy','Active Recovery'];
    return ['Kettlebell','Clubbell','Mace'];
  }

  function getRotationLength(mode){
    return getRotationForMode(mode).length;
  }

  function getPlannedSessionType(stepIndex, mode){
    const rotation = getRotationForMode(mode);
    return rotation[((Number.isFinite(stepIndex) ? stepIndex : 0) % rotation.length + rotation.length) % rotation.length];
  }


  const CLUBBELL = {
    rhythmic: [
      { name:'Side Semi Circle Swing', modes:['single','double'] },
      { name:'Inside Pendulum', modes:['single','double'] },
      { name:'Two-Handed Circle', modes:['2h'] }
    ],
    ballistic: [
      { name:'Side Clean to Back Position', modes:['single','double'] },
      { name:'Front Clean + Jerk', modes:['single','double'] },
      { name:'Side Snatch', modes:['single','double'] }
    ],
    grinds: [
      { name:'Side Press', modes:['single','double'] },
      { name:'Shoulder Cast', modes:['single','double'] },
      { name:'Shield Cast', modes:['single','double','2h'] }
    ]
  };

  const CLUB_MODE_BY_STEP = {
    'Low':'single',
    'Medium':'2h',
    'High':'double'
  };

  const MACE_FLOWS = [
    '360 + Switch Squat -> 360 + Step 1 -> 360 + Step 2 -> 360 + Step 3 -> 360 + Step 4',
    '360 + Archer Squat -> 360 + Archer Step 1 -> 360 + Archer Step 2 -> 360 + Archer Step 3 -> 360 + Archer Step 4',
    '3 x 360 -> Step 1 -> Step 2 -> Step 4',
    '3 x 360 -> Step 1 switch -> Step 3 switch -> Squat switch',
    '3 x 360 -> Step 3 + Reverse Uppercut -> Step 1 + Uppercut',
    '3 x 360 -> Step 2 Crossbody -> Switch Crossbody -> Switch Archer -> Switch Archer',
    '3 x 360 -> Step 2 -> Pivot 1 + Shield -> Pivot 2',
    '3 x 360 -> Step 2 -> Archer -> Step 2 -> Archer',
    '3 x 360 -> Step 2 -> Tall Archer',
    '3 x 360 -> Step 2 -> Step Ballistic Curl 4 -> Step 2',
    '3 x 360 -> Step 1 -> Step 3 -> Switch + Squat',
    '3 x 360 -> Step 3 + Rotation -> Step 1 + Uppercut'
  ];

  const ACTIVE_RECOVERY = {
    hips: [
      'Figure 4 Position','Figure 4 Lunge','Half Heel Sit',
      'Z Position Switches','Z Position Side Roll','Hip Openers - Prone to TGU to Bridge'
    ],
    shoulders: [
      'The Egyptian - Seated, Pike, Prone','S Movement - Seated, Pike, Prone',
      'Figure 8 in Crawl - 6 Point & 4 Point','Crawl to Crab','Pike to Tabletop'
    ],
    ankles: [
      'Ankle Series - Up & Down, In & Out, Rotations',
      "Figure 8's Toes and Ankle",'Snail','Crawl-Frog-Crab Transitions'
    ],
    spineNeck: [
      'Supine Neck Rolls - Left to Right','Hand on Knee Rolling',
      'Segmental Rolling - Neck, Arms & Legs','Forwards and Backwards Rolling'
    ],
    wrists: ['Finger Waves','Hand Circles','Tea Pot']
  };

  const KB_PHASES = [
    { key:'low', label:'Low', bell:'-1 bell', reps:'12-15 zone', note:'Other 5 lifts: 3 sets of 12-15 - Get-Up: 1x2+2' },
    { key:'medium', label:'Medium', bell:'normal bell', reps:'8-11 zone', note:'Other 5 lifts: 3 sets of 8-11 - Get-Up: 3x1 full get-up' },
    { key:'high', label:'High', bell:'+1 bell', reps:'4-7 zone', note:'Other 5 lifts: 3 sets of 4-7 - Get-Up Sit-Up: 3x4-7' }
  ];
  const CB_PHASES = [
    { key:'low', label:'Low', mode:'Single Club focus', rounds:3, note:'3 rounds' },
    { key:'medium', label:'Medium', mode:'Two-Handed Club focus', rounds:4, note:'4 rounds' },
    { key:'high', label:'High', mode:'Double Club focus', rounds:5, note:'5 rounds' }
  ];
  const MB_PHASES = [
    { key:'low', label:'Low', rounds:3, note:'2-3 flow blocks - about 2:00 rest between blocks' },
    { key:'medium', label:'Medium', rounds:4, note:'3-4 flow blocks - about 2:00 rest between blocks' },
    { key:'high', label:'High', rounds:5, note:'4-5 flow blocks - about 2:00 rest between blocks' }
  ];


  const WAVE_PLANS = [
    { kb:'high', cb:'low', mb:'medium' },
    { kb:'low', cb:'medium', mb:'high' },
    { kb:'medium', cb:'high', mb:'low' }
  ];
  const HYPERTROPHY_PLANS = [
    { type:'Kettlebell', key:'high' },
    { type:'Clubbell', key:'low' },
    { type:'Kettlebell', key:'low' },
    { type:'Mace', key:'high' },
    { type:'Kettlebell', key:'medium' },
    { type:'Clubbell', key:'medium' },
    { type:'Kettlebell', key:'high' },
    { type:'Mace', key:'low' },
    { type:'Kettlebell', key:'low' },
    { type:'Clubbell', key:'high' },
    { type:'Kettlebell', key:'medium' },
    { type:'Mace', key:'medium' }
  ];
  const phaseByKey = (arr, key) => arr.find(x => x.key === key);

  function normalizeClubbellConfig(config = {}){
    const modeInput = config.modes || {};
    const modes = {
      single: modeInput.single !== false,
      double: modeInput.double !== false,
      '2h': modeInput['2h'] !== false
    };
    if(!modes.single && !modes.double && !modes['2h']){
      modes.single = true;
      modes.double = true;
      modes['2h'] = true;
    }

    const countInput = config.counts || {};
    const counts = {
      rhythmic: Math.min(CLUBBELL_CATEGORY_LIMITS.rhythmic, Math.max(1, Number(countInput.rhythmic) || 1)),
      ballistic: Math.min(CLUBBELL_CATEGORY_LIMITS.ballistic, Math.max(1, Number(countInput.ballistic) || 1)),
      grinds: Math.min(CLUBBELL_CATEGORY_LIMITS.grinds, Math.max(1, Number(countInput.grinds) || 1))
    };

    return { modes, counts };
  }

  function normalizeClubbellSessionPicks(picks = {}){
    return {
      rhythmic: Array.isArray(picks.rhythmic) ? picks.rhythmic : picks.rhythmic ? [picks.rhythmic] : [],
      ballistic: Array.isArray(picks.ballistic) ? picks.ballistic : picks.ballistic ? [picks.ballistic] : [],
      grinds: Array.isArray(picks.grinds) ? picks.grinds : picks.grinds ? [picks.grinds] : []
    };
  }

  function getEnabledClubModes(){
    return CLUB_MODE_OPTIONS.filter(option => state.clubbellConfig.modes[option.key]).map(option => option.key);
  }

  function resolveClubbellMode(preferredMode){
    const enabledModes = getEnabledClubModes();
    if(enabledModes.includes(preferredMode)) return preferredMode;

    if(preferredMode === '2h'){
      if(enabledModes.includes('double')) return 'double';
      if(enabledModes.includes('single')) return 'single';
    }
    if(preferredMode === 'double'){
      if(enabledModes.includes('2h')) return '2h';
      if(enabledModes.includes('single')) return 'single';
    }
    if(preferredMode === 'single'){
      if(enabledModes.includes('2h')) return '2h';
      if(enabledModes.includes('double')) return 'double';
    }
    return enabledModes[0] || 'single';
  }

  function getClubbellBlockLabels(picks){
    const normalized = normalizeClubbellSessionPicks(picks);
    return ['rhythmic','ballistic','grinds'].flatMap(category =>
      normalized[category].map((exercise, index) => `${CLUBBELL_CATEGORY_LABELS[category]} ${index + 1}`)
    );
  }

  function getKbPhaseCards(phase, picks){
    const getUpName = phase.key === 'high'
      ? 'Get-Up Sit-Up'
      : phase.key === 'medium'
        ? 'Full Get-Up'
        : 'Get-Up';
    const getUpReps = phase.key === 'high'
      ? '3 x 4-7'
      : phase.key === 'medium'
        ? '3 x 1'
        : '1 x 2+2';
    const zoneReps = phase.key === 'high'
      ? '3 x 4-7'
      : phase.key === 'medium'
        ? '3 x 8-11'
        : '3 x 12-15';
    return [
      [getUpName, getUpReps],
      [picks.swing, zoneReps],
      [picks.press, zoneReps],
      [picks.clean, zoneReps],
      [picks.squat, zoneReps],
      [picks.snatch, zoneReps]
    ];
  }

  function downgradePhaseKey(key){
    if(key === 'high') return 'medium';
    if(key === 'medium') return 'low';
    return null;
  }

  function createActiveRecoverySession(typeIndex, plannedType, plannedPhase, readinessScore, adjustedReason){
    return {
      typeIndex,
      type: 'Active Recovery',
      picks: ACTIVE_RECOVERY,
      timer: null,
      plannedType,
      plannedPhase: plannedPhase || null,
      readinessScore,
      adjusted: true,
      adjustedReason
    };
  }

  function getTodayKey(){
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  function isDoneToday(){
    return state?.lastCompletedDate === getTodayKey();
  }

  function getReadinessScore(){
    const message = [
      'Readiness today? Enter 1-5.',
      '',
      '1 = Not today. Very low energy, sore, tense, or drained.',
      '2 = Reduced. Can train, but not fresh enough for the planned version.',
      '3 = Normal. Good enough for the planned session.',
      '4 = Good. Energetic, fairly fresh, moving well.',
      '5 = Great. Very fresh, sharp, and ready.',
      '',
      '1-2 = step down',
      '3-5 = run as planned'
    ].join('\n');

    const entered = window.prompt(message, '3');
    const parsed = Number(entered);
    return Number.isInteger(parsed) && parsed >= 1 && parsed <= 5 ? parsed : 3;
  }

  function downgradeSession(session){
    if(!session || session.type === 'Active Recovery'){
      return { ...session, readinessScore: session?.readinessScore ?? 3, adjusted:false };
    }

    if(session.type === 'Hypertrophy'){
      const nextKey = downgradePhaseKey(session.phase?.key);
      if(!nextKey){
        return createActiveRecoverySession(
          session.typeIndex,
          'Hypertrophy',
          null,
          session.readinessScore,
          'Low hypertrophy day downgraded to Active Recovery'
        );
      }
      const downgraded = createSession(session.typeIndex, nextKey);
      downgraded.plannedType = session.type;
      downgraded.plannedPhase = session.phase;
      downgraded.readinessScore = session.readinessScore;
      downgraded.adjusted = true;
      downgraded.adjustedReason = `${session.planType} ${session.phase.label} downgraded to ${downgraded.phase.label}`;
      return downgraded;
    }

    const plannedPhase = session.phase;
    if(['Kettlebell','Clubbell','Mace'].includes(session.type)){
      const nextKey = downgradePhaseKey(plannedPhase?.key);
      if(!nextKey){
        return createActiveRecoverySession(
          session.typeIndex,
          session.type,
          plannedPhase,
          session.readinessScore,
          `${plannedPhase.label} downgraded to Active Recovery`
        );
      }
      const downgraded = createSession(session.typeIndex, nextKey);
      downgraded.plannedType = session.type;
      downgraded.plannedPhase = plannedPhase;
      downgraded.readinessScore = session.readinessScore;
      downgraded.adjusted = true;
      downgraded.adjustedReason = `${plannedPhase.label} downgraded to ${downgraded.phase.label}`;
      return downgraded;
    }

    return { ...session, readinessScore: session.readinessScore, adjusted:false };
  }

  const appTitleEl = document.getElementById('appTitle');
  const sessionCodeEl = document.getElementById('sessionCode');
  const sessionTypeEl = document.getElementById('sessionType');
  const sessionFocusEl = document.getElementById('sessionFocus');
  const sessionTabBtn = document.getElementById('sessionTabBtn');
  const settingsTabBtn = document.getElementById('settingsTabBtn');
  const sessionCard = document.getElementById('sessionCard');
  const timerCard = document.getElementById('timerCard');
  const settingsCard = document.getElementById('settingsCard');
  const newBtn = document.getElementById('newBtn');
  const finishBtn = document.getElementById('finishBtn');
  const resetBtn = document.getElementById('resetBtn');

  let tick = null;
  let audioCtx = null;
  let wakeLock = null;

  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(e){}
  }

  async function releaseWakeLock(){
    try{
      if(wakeLock){
        await wakeLock.release();
        wakeLock = null;
      }
    }catch(e){}
  }

  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState === 'visible' && state?.activeSession?.timer?.isRunning){
      await requestWakeLock();
    }
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function makeBag(items, lastPicked){
    let bag = shuffle(items);
    if(lastPicked && bag.length > 1 && bag[0] === lastPicked){
      const i = bag.findIndex(x => x !== lastPicked);
      if(i > 0) [bag[0], bag[i]] = [bag[i], bag[0]];
    }
    return bag;
  }

  function defaultState(){
    return {
      nextSessionIndex: 0,
      activeSession: null,
      waveIndex: 0,
      hypertrophyIndex: 0,
      completedSessions: 0,
      kbWeight: 16,
      lastCompletedDate: null,
      currentTab: 'session',
      recoveryMode: 'gate',
      clubbellConfig: normalizeClubbellConfig(),
      bags: {
        clubbell: {
          rhythmic: { bag: [], last: null },
          ballistic: { bag: [], last: null },
          grinds: { bag: [], last: null }
        },
        mace: {
          flow: { bag: [], last: null }
        }
      }
    };
  }

  function loadState(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const loaded = raw ? { ...defaultState(), ...raw } : defaultState();
      if(!loaded.recoveryMode || !RECOVERY_MODES[loaded.recoveryMode]) loaded.recoveryMode = 'gate';
      loaded.currentTab = loaded.currentTab === 'settings' ? 'settings' : 'session';
      loaded.clubbellConfig = normalizeClubbellConfig(loaded.clubbellConfig);
      loaded.nextSessionIndex = ((Number.isFinite(loaded.nextSessionIndex) ? loaded.nextSessionIndex : 0) % getRotationLength(loaded.recoveryMode) + getRotationLength(loaded.recoveryMode)) % getRotationLength(loaded.recoveryMode);
      if(loaded.activeSession){
        if(loaded.activeSession.type === 'Clubbell' || (loaded.activeSession.type === 'Hypertrophy' && loaded.activeSession.planType === 'Clubbell')){
          loaded.activeSession.picks = normalizeClubbellSessionPicks(loaded.activeSession.picks);
        }
        loaded.activeSession.timer = getTimerStateForSession(loaded.activeSession);
      }
      return loaded;
    } catch(e){
      return defaultState();
    }
  }
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function pickFromBucket(bucketState, items, getKey = null){
    const keyFn = getKey || (x => x);
    if(!Array.isArray(bucketState.bag) || !bucketState.bag.length){
      bucketState.bag = makeBag(items, bucketState.last);
    }
    const picked = bucketState.bag.shift();
    bucketState.last = keyFn(picked);
    return picked;
  }

  function pickClubbellByMode(bucketState, items, mode){
    const preferred = items.filter(x => x.modes.includes(mode));
    const fallback = mode === '2h'
      ? items.filter(x => x.modes.includes('double') || x.modes.includes('single'))
      : items;
    const pool = preferred.length ? preferred : fallback;

    if(bucketState.mode !== mode || !Array.isArray(bucketState.bag) || !bucketState.bag.length){
      bucketState.mode = mode;
      bucketState.bag = makeBag(pool, bucketState.last).filter(x => x.modes.includes(mode) || !preferred.length);
      if(!bucketState.bag.length) bucketState.bag = makeBag(pool, bucketState.last);
    } else {
      bucketState.bag = bucketState.bag.filter(x => x.modes.includes(mode) || !preferred.length);
      if(!bucketState.bag.length) bucketState.bag = makeBag(pool, bucketState.last);
    }

    const picked = bucketState.bag.shift();
    bucketState.last = picked.name;
    return picked;
  }

  function pickMultipleClubbellByMode(bucketState, items, mode, count){
    const picks = [];
    const target = Math.max(1, count || 1);
    for(let i = 0; i < target; i++){
      picks.push(pickClubbellByMode(bucketState, items, mode));
    }
    return picks;
  }

  function getTimerStateForSession(session){
    if(!session?.phase) return null;
    if(session.type === 'Clubbell') return buildClubbellTimerState(session.phase.rounds, resolveClubbellMode(CLUB_MODE_BY_STEP[session.phase.label] || 'single'), getClubbellBlockLabels(session.picks));
    if(session.type === 'Mace') return buildMaceTimerState(session.phase.rounds);
    if(session.type === 'Hypertrophy' && session.planType === 'Clubbell') return buildClubbellTimerState(session.phase.rounds, resolveClubbellMode(CLUB_MODE_BY_STEP[session.phase.label] || 'single'), getClubbellBlockLabels(session.picks));
    if(session.type === 'Hypertrophy' && session.planType === 'Mace') return buildMaceTimerState(session.phase.rounds);
    return null;
  }

  function buildClubbellTimerState(rounds, mode='single', blockLabels=['Exercise A','Exercise B','Exercise C']){
    const stages = [];
    const splitMode = mode === 'single' || mode === '2h';
    const firstLabel = mode === 'single' ? 'Left' : mode === '2h' ? 'Grip A' : null;
    const secondLabel = mode === 'single' ? 'Right' : mode === '2h' ? 'Grip B' : null;
    for(let round=1; round<=rounds; round++){
      blockLabels.forEach((blockLabel) => {
        if(splitMode){
          stages.push({ label: `Round ${round} - ${blockLabel} - ${firstLabel}`, seconds: 30, splitPart:true });
          stages.push({ label: `Round ${round} - ${blockLabel} - ${secondLabel}`, seconds: 30, splitPart:true });
        } else {
          stages.push({ label: `Round ${round} - ${blockLabel}`, seconds: 60, splitPart:false });
        }
      });
      if(round < rounds) stages.push({ label: `Rest after round ${round}`, seconds: 60, splitPart:false, isRest:true });
    }
    return { stages, stageIndex: 0, stageLeft: stages[0].seconds, isRunning:false, mode };
  }


  function buildMaceTimerState(rounds){
    const stages = [];
    for(let round=1; round<=rounds; round++){
      stages.push({ label: `Block ${round} - Left`, seconds: 0 });
      stages.push({ label: `Block ${round} - Right`, seconds: 0 });
    }
    return { stages, stageIndex: 0, stageLeft: 0, isRunning:false, manual:true };
  }

  function createSession(typeIndex, forcedPhaseKey = null){
    const type = typeof typeIndex === 'string' ? typeIndex : getPlannedSessionType(typeIndex, state.recoveryMode);

    if(type === 'Kettlebell'){
      const wave = WAVE_PLANS[state.waveIndex % WAVE_PLANS.length];
      const phase = phaseByKey(KB_PHASES, forcedPhaseKey || wave.kb);
      const picks = {
        getUp: 'Get Up',
        swing: 'One-Arm Swing',
        press: 'Military Press',
        clean: 'Double Clean',
        squat: 'Double Front Squat',
        snatch: 'Snatch'
      };
      return { typeIndex, type, phase, picks, timer: null };
    }

    if(type === 'Clubbell'){
      const wave = WAVE_PLANS[state.waveIndex % WAVE_PLANS.length];
      const phase = phaseByKey(CB_PHASES, forcedPhaseKey || wave.cb);
      const mode = resolveClubbellMode(CLUB_MODE_BY_STEP[phase.label] || 'single');
      const counts = state.clubbellConfig.counts;
      const picks = {
        rhythmic: pickMultipleClubbellByMode(state.bags.clubbell.rhythmic, CLUBBELL.rhythmic, mode, counts.rhythmic),
        ballistic: pickMultipleClubbellByMode(state.bags.clubbell.ballistic, CLUBBELL.ballistic, mode, counts.ballistic),
        grinds: pickMultipleClubbellByMode(state.bags.clubbell.grinds, CLUBBELL.grinds, mode, counts.grinds)
      };
      return { typeIndex, type, phase, picks, timer: buildClubbellTimerState(phase.rounds, mode, getClubbellBlockLabels(picks)), actualMode: mode };
    }

    if(type === 'Mace'){
      const wave = WAVE_PLANS[state.waveIndex % WAVE_PLANS.length];
      const phase = phaseByKey(MB_PHASES, forcedPhaseKey || wave.mb);
      const flow = pickFromBucket(state.bags.mace.flow, MACE_FLOWS);
      return { typeIndex, type, phase, picks:{ flow }, timer: buildMaceTimerState(phase.rounds) };
    }

    if(type === 'Hypertrophy'){
      const plan = HYPERTROPHY_PLANS[state.hypertrophyIndex % HYPERTROPHY_PLANS.length];

      if(plan.type === 'Kettlebell'){
        const phase = phaseByKey(KB_PHASES, forcedPhaseKey || plan.key);
        const picks = {
          getUp: 'Get Up',
          swing: 'One-Arm Swing',
          press: 'Military Press',
          clean: 'Double Clean',
          squat: 'Double Front Squat',
          snatch: 'Snatch'
        };
        return { typeIndex, type, planType:'Kettlebell', phase, picks, timer: null };
      }

      if(plan.type === 'Clubbell'){
        const phase = phaseByKey(CB_PHASES, forcedPhaseKey || plan.key);
        const mode = resolveClubbellMode(CLUB_MODE_BY_STEP[phase.label] || 'single');
        const counts = state.clubbellConfig.counts;
        const picks = {
          rhythmic: pickMultipleClubbellByMode(state.bags.clubbell.rhythmic, CLUBBELL.rhythmic, mode, counts.rhythmic),
          ballistic: pickMultipleClubbellByMode(state.bags.clubbell.ballistic, CLUBBELL.ballistic, mode, counts.ballistic),
          grinds: pickMultipleClubbellByMode(state.bags.clubbell.grinds, CLUBBELL.grinds, mode, counts.grinds)
        };
        return { typeIndex, type, planType:'Clubbell', phase, picks, timer: buildClubbellTimerState(phase.rounds, mode, getClubbellBlockLabels(picks)), actualMode: mode };
      }

      const phase = phaseByKey(MB_PHASES, forcedPhaseKey || plan.key);
      const flow = pickFromBucket(state.bags.mace.flow, MACE_FLOWS);
      return { typeIndex, type, planType:'Mace', phase, picks:{ flow }, timer: buildMaceTimerState(phase.rounds) };
    }

    return { typeIndex, type, picks: ACTIVE_RECOVERY };
  }

  function fmt(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  async function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
  }
  async function beep(freq=880,dur=0.12,vol=0.05){
    try{
      await ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }
  async function stageBeep(){ await beep(860,.12,.07); setTimeout(()=>beep(1140,.14,.07),140); }
  async function finishBeep(){ await beep(860,.12,.07); setTimeout(()=>beep(1140,.12,.07),140); setTimeout(()=>beep(1460,.18,.08),280); }

      timerCard.style.display = 'none';
      return;
    }
    const s = state.activeSession;
    if(!s?.timer){ timerCard.style.display='none'; return; }

    timerCard.innerHTML = `

  function ensureSession(){
    if(state.activeSession) return;
    let session = createSession(state.nextSessionIndex);

    const readinessScore = getReadinessScore();
    session.readinessScore = readinessScore;
    session.plannedType = session.type;
    session.plannedPhase = session.phase || null;
    session.adjusted = false;
    if(readinessScore <= 2) session = downgradeSession(session);
    state.activeSession = session;
    saveState();
    renderView();
  }

  async function toggleTimer(){
    const s = state.activeSession;
    if(!s?.timer || s.timer.manual) return;
    s.timer.isRunning = !s.timer.isRunning;
    saveState();
    renderTimer();
    if(s.timer.isRunning){
      await requestWakeLock();
      startTick();
    } else {
      stopTick();
      await releaseWakeLock();
    }
  }

  function stopTick(){ if(tick) clearInterval(tick); tick = null; }

  function startTick(){
    stopTick();
    tick = setInterval(async () => {
      const s = state.activeSession;
      if(!s?.timer?.isRunning) return;
      const t = s.timer;
      if(t.stageLeft > 0) t.stageLeft -= 1;
      if(t.stageLeft <= 0){
        saveState();
        renderTimer();
        await advanceStage(true);
        return;
      }
      saveState();
      renderTimer();
    }, 1000);
  }

  async function advanceStage(autoContinue = false){
    const s = state.activeSession;
    if(!s?.timer) return;
    const t = s.timer;
    if(t.stageIndex >= t.stages.length - 1){
      t.isRunning = false;
      saveState();
      stopTick();
      await releaseWakeLock();
      renderTimer();
      await finishBeep();
      return;
    }
    t.stageIndex += 1;
    t.stageLeft = t.stages[t.stageIndex].seconds || 0;
    t.isRunning = autoContinue && !t.manual;
    saveState();
    stopTick();
    if(t.isRunning){
      await requestWakeLock();
    } else {
      await releaseWakeLock();
    }
    renderTimer();
    await stageBeep();
    if(t.isRunning) startTick();
  }

  async function resetTimerState(){
    const s = state.activeSession;
    if(!s?.timer) return;
    s.timer = getTimerStateForSession(s);
    saveState();
    stopTick();
    await releaseWakeLock();
    renderTimer();
  }

  function getCompletedCycles(){
    const done = Number.isFinite(state.completedSessions) ? state.completedSessions : 0;
    return Math.floor(done / 12);
  }

  function shouldOfferCycleDecision(){
    if(state.recoveryMode === 'hypertrophy') return false;
    const done = Number.isFinite(state.completedSessions) ? state.completedSessions : 0;
    const completedCycles = getCompletedCycles();
    return done > 0 && done % 12 === 0 && completedCycles >= 3;
  }

  function handleCycleDecision(){
    const completedCycles = getCompletedCycles();
    const goNext = window.confirm(`Cycle ${completedCycles} completed.\n\nPress OK for Next cycle.\nPress Cancel for Increase weight and start over.`);

    if(goNext) return;

    const currentWeight = Number.isFinite(Number(state.kbWeight)) ? Number(state.kbWeight) : 16;
    const suggestedWeight = currentWeight + 4;
    const entered = window.prompt('Enter your new kettlebell weight in kg. Leave as-is if you only want to restart the cycle count.', String(suggestedWeight));

    if(entered !== null){
      const parsed = Number(entered);
      if(Number.isFinite(parsed) && parsed >= 0) state.kbWeight = parsed;
    }

    state.completedSessions = 0;
    state.waveIndex = 0;
    state.hypertrophyIndex = 0;
    state.nextSessionIndex = 0;
  }

  async function finishSession(){
    if(!state.activeSession) return;
    const finishedType = state.activeSession.type;
    stopTick();
    await releaseWakeLock();
    confetti();
    await finishBeep();
    advanceInternalPhase(finishedType);
    state.activeSession = null;
    state.lastCompletedDate = getTodayKey();
    state.completedSessions = (Number.isFinite(state.completedSessions) ? state.completedSessions : 0) + 1;
    state.nextSessionIndex = (state.nextSessionIndex + 1) % getRotationLength(state.recoveryMode);

    if(shouldOfferCycleDecision()) handleCycleDecision();

    saveState();
    renderView();
  }

  function fullReset(){
    if(!confirm('Reset everything?')) return;
    stopTick();
    releaseWakeLock();
    state = defaultState();
    saveState();
    renderView();
  }

  function updateRecoveryMode(nextMode){
    if(!RECOVERY_MODES[nextMode] || nextMode === state.recoveryMode) return;
    state.recoveryMode = nextMode;
    state.nextSessionIndex = 0;
    state.waveIndex = 0;
    state.hypertrophyIndex = 0;
    state.activeSession = null;
    saveState();
    renderView();
  }

  function updateClubbellMode(modeKey, enabled){
    const nextConfig = normalizeClubbellConfig({
      ...state.clubbellConfig,
      modes: { ...state.clubbellConfig.modes, [modeKey]: enabled }
    });
    state.clubbellConfig = nextConfig;
    state.activeSession = null;
    saveState();
    renderSettings();
  }

  function updateClubbellCount(categoryKey, value){
    const nextConfig = normalizeClubbellConfig({
      ...state.clubbellConfig,
      counts: { ...state.clubbellConfig.counts, [categoryKey]: Number(value) }
    });
    state.clubbellConfig = nextConfig;
    state.activeSession = null;
    saveState();
    renderSettings();
  }

  function setTab(tab){
    state.currentTab = tab === 'settings' ? 'settings' : 'session';
    saveState();
    renderView();
  }

  let state = loadState();
  newBtn.addEventListener('click', () => { ensureSession(); renderView(); });
  finishBtn.addEventListener('click', finishSession);
  resetBtn.addEventListener('click', fullReset);
  if(sessionTabBtn) sessionTabBtn.addEventListener('click', () => setTab('session'));
  if(settingsTabBtn) settingsTabBtn.addEventListener('click', () => setTab('settings'));

  renderView();
})();
</script>
</body>
</html>
